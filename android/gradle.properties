org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin's incremental compiler computes relative paths between the project
# and its dependencies; when the Pub cache and the project live on different
# Windows drive letters (e.g. project on D:, Pub cache on C:), that throws
# "this and base files have different roots". Disabling incremental
# compilation avoids it — this only affects local build speed, not app
# behavior.
kotlin.incremental=false
